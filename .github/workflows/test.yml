name: Test & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore csharp/MarcusMedina.Fluent.Maths.Algebra.slnx
    
    - name: Build
      run: dotnet build csharp/MarcusMedina.Fluent.Maths.Algebra.slnx --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test csharp/MarcusMedina.Fluent.Maths.Algebra.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/test-results.trx'
