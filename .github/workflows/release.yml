name: Release to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore csharp
    
    - name: Build
      run: dotnet build csharp --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test csharp --configuration Release --no-build
    
    - name: Pack NuGet package
      run: dotnet pack csharp/src/MarcusMedina.Fluent.Maths.Algebra/MarcusMedina.Fluent.Maths.Algebra.csproj --configuration Release --output ./artifacts
    
    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
    
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## NuGet Package Published
          
          Package: `MarcusMedina.Fluent.Maths.Algebra`
          Version: `${{ github.ref }}`
          
          See [CHANGELOG.md](../../CHANGELOG.md) for details.
        draft: false
        prerelease: false
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg
